<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRIFT · Avlys AI live demo</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<script src="/assets/icons.js"></script>

<div class="app">
  <div class="topbar">
    <div class="brand">Avlys AI <small>P2P camera</small></div>
    <nav class="appnav" aria-label="App">
      <button type="button" id="nav-demo" class="on">Live Demo</button>
      <button type="button" id="nav-sim">Simulator</button>
      <button type="button" id="nav-ui">Avlys UI</button>
    </nav>
    <span class="pill ctrl" id="netPill">local only</span>
  </div>

  <div class="hub" id="view-demo">
    <div class="hub-help">
      <span><b>1</b> Start the camera &nbsp;·&nbsp; <b>2</b> Copy the 6-digit PIN &nbsp;·&nbsp; <b>3</b> Connect on the viewer</span>
      <details>
        <summary>Use a phone instead</summary>
        <div class="hub-phone">
          <div class="qr" id="qrBox"><svg viewBox="0 0 1 1"></svg></div>
          <div class="stack" style="gap:.45rem;min-width:0">
            <div class="lbl">Camera URL on this LAN</div>
            <div class="urlbox" id="camUrl">detecting…</div>
            <div class="row" id="altAddrs"></div>
            <p class="hint" style="margin:0">Same Wi-Fi. Camera on a phone needs HTTPS — this server is HTTP, so use the laptop pane, or open <span class="mono">localhost</span> on this machine.</p>
          </div>
        </div>
      </details>
    </div>
    <div class="hub-split">
      <div class="hub-pane">
        <iframe src="/camera.html" title="Camera" allow="camera; microphone; autoplay"></iframe>
      </div>
      <div class="hub-pane">
        <iframe src="/viewer.html" title="Viewer" allow="camera; microphone; autoplay"></iframe>
      </div>
    </div>
  </div>

  <div class="hub" id="view-sim" hidden>
    <iframe class="hub-frame" src="/simulator.html" title="Architecture simulator"></iframe>
  </div>

  <div class="hub" id="view-ui" hidden>
    <iframe class="hub-frame" src="/appflow.html" title="Avlys mobile app flow"></iframe>
  </div>
</div>

<script src="/assets/qr.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  function show(which) {
    var views = { demo: 'view-demo', sim: 'view-sim', ui: 'view-ui' };
    Object.keys(views).forEach(function (k) { $(views[k]).hidden = k !== which; });
    $('nav-demo').classList.toggle('on', which === 'demo');
    $('nav-sim').classList.toggle('on', which === 'sim');
    $('nav-ui').classList.toggle('on', which === 'ui');
    var hash = which === 'sim' ? '#simulator' : which === 'ui' ? '#ui' : '#demo';
    try { history.replaceState(null, '', hash); } catch (e) {}
  }

  $('nav-demo').onclick = function () { show('demo'); };
  $('nav-sim').onclick = function () { show('sim'); };
  $('nav-ui').onclick = function () { show('ui'); };
  function fromHash() {
    var h = location.hash;
    if (h.indexOf('sim') !== -1) return 'sim';
    if (h.indexOf('ui') !== -1 || h.indexOf('app') !== -1) return 'ui';
    return 'demo';
  }
  show(fromHash());
  window.addEventListener('hashchange', function () { show(fromHash()); });

  function render(url) {
    $('camUrl').textContent = url;
    try { $('qrBox').innerHTML = QR.svg(url, { quiet: 3 }); } catch (err) {
      $('qrBox').style.display = 'none';
    }
  }

  fetch('/api/net').then(function (r) { return r.json(); }).then(function (d) {
    var addrs = d.addresses || [];
    if (!addrs.length) {
      $('netPill').textContent = 'no LAN address found';
      $('netPill').className = 'pill warn';
      render(location.origin + '/camera.html');
      return;
    }
    var build = function (a) { return d.scheme + '://' + a.address + ':' + d.port + '/camera.html'; };
    render(build(addrs[0]));
    $('netPill').textContent = addrs[0].address;
    if (addrs.length > 1) {
      var box = $('altAddrs');
      var lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = 'other interfaces';
      box.appendChild(lbl);
      addrs.slice(1).forEach(function (a) {
        var b = document.createElement('button');
        b.className = 'btn sm';
        b.type = 'button';
        b.textContent = a.address;
        b.onclick = function () { render(build(a)); $('netPill').textContent = a.address; };
        box.appendChild(b);
      });
    }
  }).catch(function () { render(location.origin + '/camera.html'); });
})();
</script>
</body>
</html>
